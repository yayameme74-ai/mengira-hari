<!DOCTYPE html>
<html lang="ms" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walimatulurus Erna & Aiman | 2027-01-02</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        blush: {
                            50: '#F9EEF0',
                            100: '#F1DDE2',
                            200: '#E5C0CA',
                            300: '#D8AAB5',
                            400: '#B97888',
                            500: '#6B0F1A',
                            600: '#4A0810',
                        },
                        dusty: {
                            100: '#F3E8EA',
                            200: '#E5CDD2',
                            300: '#D0AEB7',
                            400: '#B17D8A',
                            500: '#6E1824',
                            600: '#450B14',
                        },
                        gold: {
                            200: '#F7E7B4',
                            300: '#E8C872',
                            400: '#D4AF37',
                            500: '#B68D2C',
                            600: '#8B6508',
                        },
                        rosewood: '#3A060E',
                        cream: '#FFFDF9',
                    },
                    fontFamily: {
                        serif: ['Cormorant Garamond', 'Playfair Display', 'serif'],
                        sans: ['Plus Jakarta Sans', 'Montserrat', 'sans-serif'],
                        script: ['Parisienne', 'cursive']
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Parisienne&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- YouTube Iframe API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <!-- Firebase App (Compat) & Firestore -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #FFFDF9;
            color: #48232D;
        }
        .font-script {
            font-family: 'Parisienne', cursive;
        }
        .font-serif-cormorant {
            font-family: 'Cormorant Garamond', serif;
        }
        .font-monogram {
            font-family: 'Cinzel', 'Cormorant Garamond', serif;
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #FFFDF9;
        }
        ::-webkit-scrollbar-thumb {
            background: #8B2635;
            border-radius: 4px;
        }

        /* Soundwave Bar Animation */
        .bar {
            width: 3px;
            height: 12px;
            background-color: #8B2635;
            display: inline-block;
            border-radius: 2px;
            animation: bounce 1.2s ease-in-out infinite alternate;
        }
        .bar:nth-child(2) { animation-delay: 0.2s; }
        .bar:nth-child(3) { animation-delay: 0.4s; }
        .bar:nth-child(4) { animation-delay: 0.6s; }

        @keyframes bounce {
            0% { height: 4px; }
            100% { height: 16px; }
        }
        .paused .bar {
            animation-play-state: paused;
            height: 4px;
        }

        .gold-gradient-text {
            background: linear-gradient(135deg, #B68D2C 0%, #E8C872 50%, #8B6508 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .envelope-shadow {
            box-shadow: 0 20px 40px -15px rgba(66, 8, 16, 0.35);
        }

        /* ===== Tema Burgundy & Emas Berinspirasikan Gambar ===== */
        #openingOverlay {
            background: radial-gradient(circle at 50% 40%, #68111B 0%, #3E070E 65%, #260307 100%);
            overflow: hidden;
            isolation: isolate;
        }

        #openingOverlay::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(circle at 15% 15%, rgba(212, 175, 55, 0.14), transparent 32%),
                radial-gradient(circle at 85% 18%, rgba(212, 175, 55, 0.12), transparent 34%),
                radial-gradient(circle at 20% 85%, rgba(212, 175, 55, 0.12), transparent 36%),
                radial-gradient(circle at 82% 84%, rgba(212, 175, 55, 0.14), transparent 35%);
            z-index: -2;
            pointer-events: none;
        }

        .opening-frame {
            position: relative;
            z-index: 5;
            width: min(92vw, 430px);
            min-height: min(92vh, 860px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 44px 24px;
            border: 1px solid rgba(232, 200, 114, 0.35);
            border-radius: 28px;
            background: rgba(42, 5, 10, 0.45);
            backdrop-filter: blur(2px);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45), inset 0 0 35px rgba(212, 175, 55, 0.08);
        }

        /* Initial E & A di tengah dengan garisan pemisah emas */
        .ea-monogram-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 18px;
            animation: logoFloat 6s ease-in-out infinite;
        }

        .ea-initials-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            font-family: 'Cinzel', 'Cormorant Garamond', serif;
            color: #F3E5AB;
            text-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
        }

        .ea-letter {
            font-size: clamp(3.2rem, 11vw, 4.6rem);
            font-weight: 600;
            line-height: 1;
            letter-spacing: 0.06em;
        }

        .ea-divider {
            width: 1.5px;
            height: clamp(46px, 12vw, 66px);
            background: linear-gradient(180deg, transparent, #E8C872 25%, #E8C872 75%, transparent);
        }

        .ea-sub-label {
            margin-top: 8px;
            font-size: 0.72rem;
            letter-spacing: 0.34em;
            text-transform: uppercase;
            color: #E8C872;
            font-weight: 600;
        }

        .opening-names {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0;
            line-height: 0.85;
            margin: 8px 0 12px;
        }

        .opening-name {
            font-family: "Parisienne", cursive;
            font-size: clamp(4.2rem, 14vw, 6.6rem);
            color: #FFF6E0;
            line-height: 0.85;
            text-align: center;
            text-shadow: 0 3px 16px rgba(0, 0, 0, 0.35);
        }

        .opening-amp {
            font-family: "Cormorant Garamond", serif;
            font-size: clamp(2.4rem, 7vw, 3.5rem);
            color: #E8C872;
            line-height: 0.95;
            margin: 6px 0 5px;
        }

        .opening-date {
            font-size: clamp(1rem, 3.8vw, 1.35rem) !important;
            letter-spacing: 0.14em;
            font-weight: 600;
            color: #F7E7B4;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .lily-opening-title {
            color: #FFF6E0;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
        }

        .lily-opening-line {
            width: 160px;
            height: 1px;
            margin: 12px auto 16px;
            background: linear-gradient(90deg, transparent, #E8C872, transparent);
        }

        .lily-open-btn {
            margin-top: 22px;
            min-width: 230px;
            background: linear-gradient(135deg, #8B6508, #D4AF37 55%, #8B6508);
            color: #2B0508 !important;
            border: 1px solid rgba(247, 231, 180, 0.85);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
        }

        .lily-petal {
            position: absolute;
            width: 12px;
            height: 18px;
            border-radius: 75% 25% 75% 25%;
            background: linear-gradient(135deg, rgba(232, 200, 114, 0.72), rgba(168, 36, 54, 0.35));
            filter: blur(0.15px);
            pointer-events: none;
            z-index: 4;
            animation: lilyPetalFall linear infinite;
        }

        .lp1 { left: 8%; top: 18%; animation-duration: 14s; animation-delay: -5s; }
        .lp2 { left: 82%; top: 30%; animation-duration: 17s; animation-delay: -10s; transform: scale(.75); }
        .lp3 { left: 16%; top: 55%; animation-duration: 16s; animation-delay: -8s; transform: scale(.55); }
        .lp4 { left: 76%; top: 62%; animation-duration: 19s; animation-delay: -13s; transform: scale(.65); }
        .lp5 { left: 48%; top: 20%; animation-duration: 21s; animation-delay: -4s; transform: scale(.45); }

        @keyframes lilyPetalFall {
            0% { transform: translate3d(0, -20px, 0) rotate(0deg); opacity: 0; }
            12% { opacity: .72; }
            50% { transform: translate3d(28px, 45vh, 0) rotate(130deg); opacity: .65; }
            100% { transform: translate3d(-24px, 110vh, 0) rotate(280deg); opacity: 0; }
        }

        @media (max-width: 600px) {
            .opening-frame {
                min-height: 92vh;
                padding: 32px 18px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .ea-monogram-box, .lily-petal { animation: none !important; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-blush-200 selection:text-rosewood relative overflow-x-hidden">

    <canvas id="petalCanvas" class="fixed inset-0 pointer-events-none z-20 w-full h-full"></canvas>

    <!-- Hidden Audio Player Elements -->
    <div class="hidden">
        <div id="ytAudioPlayer"></div>
        <audio id="backupAudio" loop preload="auto">
            <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=romantic-wedding-piano-112191.mp3" type="audio/mpeg">
        </audio>
    </div>

    <!-- Opening Overlay: Tema Burgundy & Emas dengan Initial E & A -->
    <div id="openingOverlay" class="fixed inset-0 z-50 flex flex-col items-center justify-center p-4 transition-all duration-700">
        <span class="lily-petal lp1"></span>
        <span class="lily-petal lp2"></span>
        <span class="lily-petal lp3"></span>
        <span class="lily-petal lp4"></span>
        <span class="lily-petal lp5"></span>

        <div class="opening-frame">
            <!-- Initial E | A -->
            <div class="ea-monogram-box" aria-label="Initial Erna dan Aiman">
                <div class="ea-initials-row">
                    <span class="ea-letter">E</span>
                    <span class="ea-divider"></span>
                    <span class="ea-letter">A</span>
                </div>
                <span class="ea-sub-label">Walimatulurus</span>
            </div>

            <div class="lily-opening-line"></div>

            <div class="opening-names">
                <span class="opening-name">Erna</span>
                <span class="opening-amp">&amp;</span>
                <span class="opening-name">Aiman</span>
            </div>

            <p class="opening-date font-serif-cormorant mt-2">02 • 01 • 2027</p>

            <button id="openInvitationBtn" type="button" class="lily-open-btn px-7 py-3 rounded-full font-semibold tracking-wider text-xs uppercase transition-all duration-300 hover:scale-105 cursor-pointer">
                Buka Kad Jemputan
            </button>
        </div>
    </div>

    <!-- Kandungan Utama Selepas Kad Dibuka -->
    <main id="mainContent" class="flex-grow">
        <section class="max-w-3xl mx-auto px-6 py-16 text-center">
            <div class="inline-flex items-center gap-3 px-4 py-1.5 rounded-full bg-blush-50 border border-blush-200 text-blush-500 text-xs font-semibold tracking-widest uppercase mb-6">
                <span>E &amp; A</span>
                <span>•</span>
                <span>2 Januari 2027</span>
            </div>

            <h1 class="font-script text-5xl sm:text-6xl text-blush-500 mb-3">Erna &amp; Aiman</h1>
            <p class="font-serif-cormorant italic text-xl sm:text-2xl text-dusty-500 max-w-xl mx-auto">
                “Dengan penuh kesyukuran ke hadrat Ilahi, kami menjemput anda ke majlis perkahwinan kami.”
            </p>
        </section>
    </main>

    <script>
        const openBtn = document.getElementById('openInvitationBtn');
        const overlay = document.getElementById('openingOverlay');
        const backupAudio = document.getElementById('backupAudio');

        if (openBtn && overlay) {
            openBtn.addEventListener('click', () => {
                overlay.classList.add('opacity-0', 'pointer-events-none');
                setTimeout(() => {
                    overlay.style.display = 'none';
                }, 700);
                if (backupAudio) {
                    backupAudio.play().catch(() => {});
                }
            });
        }
    </script>
</body>
</html>
